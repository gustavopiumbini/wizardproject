services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula_dev
      POSTGRES_DB: aula_em_dia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula -d aula_em_dia"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web

volumes:
  pgdata:
